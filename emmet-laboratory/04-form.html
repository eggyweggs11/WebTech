<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <hr>
    <p>
    <form>
        <label for="studID">Student ID:</label><br>
        <input type="text" name="studID" id="studID" placeholder="Enter your Student ID"><br><br>

        <label for="fname">Full Name:</label><br>
        <input type="text" name="fname" id="fname" placeholder="Enter full name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email" placeholder="Enter valid email"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" name="password" id="password" placeholder="Enter password"><br><br>

        <label for="gender">Gender:</label><br>

        <input type="radio" name="gender" id="male">
        <label for="male">Male</label><br>
        <input type="radio" name="gender" id="female">
        <label for="female">Female</label><br>
        <input type="radio" name="gender" id="noPref">
        <label for="noPref">Prefer not to say</label><br><br>

        <label for="course">Course:</label><br>
        <input type="text" name="course" id="course" placeholder="Enter course"><br><br>

        <label for="hobbies">Hobbies:</label><br>
        <input type="text" name="hobbies" id="hobbies" placeholder="Enter hobbies"><br><br>

        <label for="address">Address:</label><br>
        <input type="text" name="address" id="address" placeholder="Enter address"><br><br>

        <button type="submit">Submit</button>

    </form>
    </p>
</body>

</html>
